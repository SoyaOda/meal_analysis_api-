<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDA Retriever API Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .search-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .search-panel h2 {
            color: #43e97b;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #43e97b;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 15px 50px 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #43e97b;
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5em;
            color: #999;
        }

        .form-group input[type="number"],
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #43e97b;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(67, 233, 123, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .results-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
        }

        .results-panel h2 {
            color: #43e97b;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #43e97b;
            padding-bottom: 10px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            font-weight: bold;
            color: #43e97b;
        }

        .food-item {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #43e97b;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .food-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .food-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .food-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            flex: 1;
        }

        .food-score {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .food-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #666;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nutrition-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .nutrition-item {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .nutrition-value {
            font-weight: bold;
            color: #43e97b;
            font-size: 1.1em;
        }

        .nutrition-label {
            font-size: 0.85em;
            color: #666;
            margin-top: 3px;
        }

        .portions-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .portions-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #555;
        }

        .portions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
        }

        .portion-item {
            background: #f0f8f0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85em;
        }

        .portion-desc {
            font-weight: 600;
            color: #43e97b;
        }

        .portion-weight {
            color: #666;
        }

        .score-breakdown {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.85em;
        }

        .score-breakdown-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }

        .score-components {
            display: flex;
            gap: 15px;
        }

        .score-component {
            flex: 1;
        }

        .score-component-label {
            color: #666;
        }

        .score-component-value {
            font-weight: bold;
            color: #43e97b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #43e97b;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .collapsible-section {
            margin-top: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .collapsible-header {
            background: #f0f8f0;
            padding: 12px 15px;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #43e97b;
        }

        .collapsible-header:hover {
            background: #e0f0e0;
        }

        .collapsible-content {
            padding: 15px;
            display: none;
        }

        .collapsible-content.show {
            display: block;
        }

        .toggle-icon {
            transition: transform 0.3s;
        }

        .toggle-icon.open {
            transform: rotate(180deg);
        }

        .mode-badges {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid #e0e0e0;
            background: white;
        }

        .mode-badge.active {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            border-color: #43e97b;
        }

        .accordion {
            margin-top: 20px;
        }

        .accordion-header {
            background: #43e97b;
            color: white;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .accordion-content {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            display: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .accordion-content.show {
            display: block;
        }

        .accordion-content pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 USDA Retriever API Demo</h1>
            <p>USDA FoodData Centralから食材を検索</p>
        </div>

        <div class="content">
            <!-- Search Panel -->
            <div class="search-panel">
                <h2>🔎 食材検索</h2>

                <!-- Search Mode Selection -->
                <div class="form-group">
                    <label>検索モード</label>
                    <div class="mode-badges">
                        <div class="mode-badge" onclick="selectMode('fast')">
                            ⚡ Fast
                        </div>
                        <div class="mode-badge" onclick="selectMode('accurate')">
                            🎯 Accurate
                        </div>
                        <div class="mode-badge active" onclick="selectMode('hybrid')">
                            💎 Hybrid (推奨)
                        </div>
                    </div>
                </div>

                <!-- Search Input -->
                <div class="form-group">
                    <label>検索クエリ</label>
                    <div class="search-input-wrapper">
                        <input
                            type="text"
                            id="searchQuery"
                            class="search-input"
                            placeholder="例: chicken breast grilled"
                            onkeypress="handleKeyPress(event)"
                        >
                        <span class="search-icon">🔍</span>
                    </div>
                </div>

                <!-- Advanced Settings (Collapsible) -->
                <div class="collapsible-section">
                    <div class="collapsible-header" onclick="toggleSection('searchSettings')">
                        <span>⚙️ 詳細設定</span>
                        <span class="toggle-icon" id="searchSettings-icon">▼</span>
                    </div>
                    <div class="collapsible-content" id="searchSettings">
                        <div class="form-group">
                            <label>Top K (結果数: 1-50)</label>
                            <input type="number" id="topK" min="1" max="50" value="10">
                        </div>

                        <div class="form-group">
                            <label>API URL</label>
                            <select id="apiUrl">
                                <option value="http://localhost:8006">ローカル (localhost:8006)</option>
                                <option value="https://freeform-usda-meal-analysis-api-1077966746907.us-central1.run.app">本番環境 (Cloud Run)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 10px;">
                                <input type="checkbox" id="includeNutrition" checked>
                                栄養情報を含める
                            </label>
                        </div>

                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 10px;">
                                <input type="checkbox" id="debugMode">
                                デバッグモード
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Search Button -->
                <button class="btn btn-primary" onclick="search()">
                    🔍 検索
                </button>

                <!-- Loading Indicator -->
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <div style="color: #43e97b; font-size: 1.1em;">検索中...</div>
                </div>

                <!-- Error Message -->
                <div class="error-message" id="errorMessage"></div>
            </div>

            <!-- Results Panel -->
            <div class="results-panel">
                <h2>📊 検索結果</h2>

                <div id="statsBar" style="display: none;" class="stats-bar"></div>

                <div id="resultsContainer">
                    <div class="empty-state">
                        <div style="font-size: 4em; margin-bottom: 20px;">📋</div>
                        <div style="font-size: 1.2em;">検索クエリを入力して検索を開始してください</div>
                    </div>
                </div>

                <!-- Raw JSON (Collapsible) -->
                <div class="accordion" id="jsonAccordion" style="display: none;">
                    <div class="accordion-header" onclick="toggleAccordion()">
                        📄 Raw JSON レスポンス
                    </div>
                    <div class="accordion-content" id="rawJson">
                        <pre id="jsonContent"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'hybrid';

        function selectMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-badge').forEach(badge => {
                badge.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function toggleSection(sectionId) {
            const content = document.getElementById(sectionId);
            const icon = document.getElementById(sectionId + '-icon');
            content.classList.toggle('show');
            icon.classList.toggle('open');
        }

        function toggleAccordion() {
            document.getElementById('rawJson').classList.toggle('show');
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                search();
            }
        }

        async function search() {
            const query = document.getElementById('searchQuery').value.trim();

            if (!query) {
                alert('検索クエリを入力してください');
                return;
            }

            // Build URL with parameters
            const apiUrl = document.getElementById('apiUrl').value;
            const topK = document.getElementById('topK').value;
            const includeNutrition = document.getElementById('includeNutrition').checked;
            const debug = document.getElementById('debugMode').checked;

            const params = new URLSearchParams({
                q: query,
                mode: currentMode,
                top_k: topK,
                include_nutrition: includeNutrition,
                debug: debug
            });

            // UI updates
            document.getElementById('loading').classList.add('show');
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('statsBar').style.display = 'none';
            document.getElementById('jsonAccordion').style.display = 'none';

            try {
                const response = await fetch(`${apiUrl}/api/v1/retrieve?${params}`, {
                    method: 'GET',
                    signal: AbortSignal.timeout(10000) // 10秒タイムアウト
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();
                displayResults(result);

            } catch (error) {
                console.error('Search failed:', error);
                const errorMsg = document.getElementById('errorMessage');
                errorMsg.textContent = `エラー: ${error.message}`;
                errorMsg.classList.add('show');

                document.getElementById('resultsContainer').innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 3em; margin-bottom: 20px;">❌</div>
                        <div style="font-size: 1.2em; color: #c62828;">検索に失敗しました</div>
                    </div>
                `;
            } finally {
                document.getElementById('loading').classList.remove('show');
            }
        }

        function displayResults(data) {
            // Stats Bar
            const statsBar = document.getElementById('statsBar');
            statsBar.style.display = 'flex';
            statsBar.innerHTML = `
                <div class="stat-item">
                    <span class="stat-label">検索クエリ:</span>
                    <span class="stat-value">${data.query}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">モード:</span>
                    <span class="stat-value">${data.mode}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">結果数:</span>
                    <span class="stat-value">${data.metadata.total_results}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">検索時間:</span>
                    <span class="stat-value">${data.metadata.search_time_ms}ms</span>
                </div>
            `;

            // Results
            const container = document.getElementById('resultsContainer');

            if (data.results.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 3em; margin-bottom: 20px;">🔍</div>
                        <div style="font-size: 1.2em;">結果が見つかりませんでした</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = data.results.map((item, index) => {
                const hasNutrition = item.nutrition_per_100g;
                const hasPortions = item.portions && item.portions.length > 0;
                const hasScoreBreakdown = item.component_scores;

                return `
                    <div class="food-item">
                        <div class="food-header">
                            <div class="food-name">${index + 1}. ${item.description || item.main_name}</div>
                            <div class="food-score">Score: ${item.score.toFixed(3)}</div>
                        </div>

                        <div class="food-meta">
                            <div class="meta-item">
                                <span>📦</span>
                                <span>FDC ID: ${item.fdc_id}</span>
                            </div>
                            <div class="meta-item">
                                <span>🏷️</span>
                                <span>${item.source}</span>
                            </div>
                            ${item.main_name !== item.description ? `
                                <div class="meta-item">
                                    <span>📝</span>
                                    <span>${item.main_name}</span>
                                </div>
                            ` : ''}
                        </div>

                        ${hasNutrition ? `
                            <div class="nutrition-grid">
                                <div class="nutrition-item">
                                    <div class="nutrition-value">${item.nutrition_per_100g.calories}</div>
                                    <div class="nutrition-label">kcal</div>
                                </div>
                                <div class="nutrition-item">
                                    <div class="nutrition-value">${item.nutrition_per_100g.protein}g</div>
                                    <div class="nutrition-label">タンパク質</div>
                                </div>
                                <div class="nutrition-item">
                                    <div class="nutrition-value">${item.nutrition_per_100g.fat}g</div>
                                    <div class="nutrition-label">脂質</div>
                                </div>
                                <div class="nutrition-item">
                                    <div class="nutrition-value">${item.nutrition_per_100g.carbs}g</div>
                                    <div class="nutrition-label">炭水化物</div>
                                </div>
                            </div>
                        ` : ''}

                        ${hasScoreBreakdown ? `
                            <div class="score-breakdown">
                                <div class="score-breakdown-title">スコア内訳:</div>
                                <div class="score-components">
                                    ${item.component_scores.bm25 !== undefined ? `
                                        <div class="score-component">
                                            <span class="score-component-label">BM25: </span>
                                            <span class="score-component-value">${item.component_scores.bm25.toFixed(3)}</span>
                                        </div>
                                    ` : ''}
                                    ${item.component_scores.vector !== undefined ? `
                                        <div class="score-component">
                                            <span class="score-component-label">Vector: </span>
                                            <span class="score-component-value">${item.component_scores.vector.toFixed(3)}</span>
                                        </div>
                                    ` : ''}
                                    ${item.component_scores.rrf !== undefined ? `
                                        <div class="score-component">
                                            <span class="score-component-label">RRF: </span>
                                            <span class="score-component-value">${item.component_scores.rrf.toFixed(3)}</span>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        ` : ''}

                        ${hasPortions ? `
                            <div class="portions-section">
                                <div class="portions-title">📏 利用可能な単位:</div>
                                <div class="portions-grid">
                                    ${item.portions.map(portion => `
                                        <div class="portion-item">
                                            <div class="portion-desc">${portion.description}</div>
                                            <div class="portion-weight">${portion.gram_weight}g</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            // Raw JSON
            document.getElementById('jsonAccordion').style.display = 'block';
            document.getElementById('jsonContent').textContent = JSON.stringify(data, null, 2);
        }

        // Auto-focus search input on load
        window.onload = () => {
            document.getElementById('searchQuery').focus();
        };
    </script>
</body>
</html>
